<!DOCTYPE html>
<!-- CsqWatch 監視画面   Author: yuichi -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>CsqWatch</title>
  <script src="chart.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #0b1120; color: #f8fafc; margin: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; padding-bottom: 10px; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; color: #38bdf8; margin: 0; }
    .status-badge { font-size: 0.85rem; font-weight: bold; padding: 4px 10px; border-radius: 9999px; background: #1e293b; color: #94a3b8; }
    .status-badge.live  { color: #22c55e; }
    .status-badge.stale { color: #f87171; }
    .head-right { display: flex; align-items: center; gap: 12px; }
    .manual-link { font-size: 0.85rem; color: #94a3b8; text-decoration: none; border: 1px solid #334155; border-radius: 9999px; padding: 4px 10px; }
    .manual-link:hover { color: #f8fafc; border-color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: #1e293b; border-radius: 8px; padding: 15px; border-left: 4px solid #38bdf8; }
    .card.extra { border-left-color: #a78bfa; }
    .card-title { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .card-val { font-size: 1.6rem; font-weight: bold; margin-top: 6px; }
    .chart-container { background: #1e293b; border-radius: 8px; padding: 16px; height: 360px; }
  </style>
</head>
<body>
  <header>
    <h1>&#x1F6F0;&#xFE0F; CsqWatch 信号監視<span id="device"></span></h1>
    <div class="head-right">
      <a class="manual-link" href="manual.html" target="_blank" title="使い方・設計・AT コマンド表 (manual.html)">説明書</a>
      <div class="status-badge" id="badge">● NO DATA</div>
    </div>
  </header>

  <div class="grid">
    <div class="card"><div class="card-title">Downlink RSSI</div><div class="card-val" id="valRssi">--</div></div>
    <div class="card"><div class="card-title">Signal Level</div><div class="card-val" id="valDbm">--</div></div>
    <div class="card"><div class="card-title">Network State</div><div class="card-val" id="valReg" style="font-size: 1.1rem;">--</div></div>
    <div class="card"><div class="card-title">Last Poll</div><div class="card-val" id="valTime" style="font-size: 1.1rem;">--:--:--</div></div>
  </div>
  <div class="grid" id="extras"></div>

  <div class="chart-container">
    <canvas id="telemetryChart"></canvas>
  </div>

  <script>
    // データは Monitor.ps1 が書き出す data.js (window.CSQ_DATA) から読む。
    // <script> の読み込みなので、ファイルをダブルクリックで開いても (file://) 動く。
    var chart;
    function $(id) { return document.getElementById(id); }

    function setBadge(text, cls) {
      var b = $('badge');
      b.textContent = '● ' + text;
      b.className = 'status-badge ' + (cls || '');
    }

    function initChart() {
      chart = new Chart($('telemetryChart').getContext('2d'), {
        type: 'line',
        data: { labels: [], datasets: [{
          label: 'CSQ (0-55)', data: [],
          borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.15)',
          fill: true, tension: 0.2
        }]},
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          scales: {
            y: { min: 0, max: 55, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
          },
          plugins: { legend: { labels: { color: '#f8fafc' } } }
        }
      });
      loadData();
      setInterval(loadData, 3000);
    }

    function loadData() {
      var old = $('dataScript');
      if (old) old.remove();
      var s = document.createElement('script');
      s.id = 'dataScript';
      s.charset = 'utf-8';
      s.onload = function () { render(window.CSQ_DATA); };
      s.onerror = function () { setBadge('NO DATA (Monitor 未起動?)', 'stale'); };
      s.src = 'data.js?t=' + Date.now();
      document.head.appendChild(s);
    }

    function render(d) {
      if (!d || !d.current) return;
      var c = d.current;
      // 見出しと窓のタイトルに機器名 (Config.ps1 の $DeviceName) を出す
      var dev = d.deviceName ? ' \u2014 ' + d.deviceName : '';
      $('device').textContent = dev;
      document.title = 'CsqWatch' + dev;

      // 取得失敗 (CsqOk=false) と、端末が返した圏外 (99) を分けて表示する
      var failed = (c.CsqOk === false);
      $('valRssi').textContent = failed ? '--' : ((c.Rssi === 99) ? '圏外 (99)' : c.Rssi);
      $('valDbm').textContent  = c.Dbm;
      $('valDbm').style.color  = failed ? '#f87171' : '';
      $('valReg').textContent  = c.RegStatus;
      var lu = String(c.LastUpdate || '');
      $('valTime').textContent = (lu.indexOf(' ') !== -1) ? lu.split(' ')[1] : '--:--:--';

      var ex = $('extras');
      ex.textContent = '';
      (c.Extras || []).forEach(function (e) {
        var card = document.createElement('div'); card.className = 'card extra';
        var t = document.createElement('div');    t.className = 'card-title'; t.textContent = e.name;
        var v = document.createElement('div');    v.className = 'card-val';   v.style.fontSize = '1.1rem'; v.textContent = e.value;
        card.appendChild(t); card.appendChild(v); ex.appendChild(card);
      });

      // 目盛りの最大値は data.js の rssiMax (Config.ps1 の $RssiMax) に合わせる
      var mx = d.rssiMax || 55;
      chart.options.scales.y.max = mx;
      chart.data.datasets[0].label = 'CSQ (0-' + mx + ')';

      var h = d.history || [];
      chart.data.labels = h.map(function (x) { return x.t.indexOf(' ') !== -1 ? x.t.split(' ')[1] : x.t; });
      chart.data.datasets[0].data = h.map(function (x) { return x.r; });
      chart.update();

      // 更新が止まっていたら STALE 表示 (Monitor が落ちたことに気づける)
      var age = (Date.now() - new Date(lu.replace(' ', 'T')).getTime()) / 1000;
      var limit = Math.max(15, (d.intervalSec || 180) * 2 + 10);
      if (isNaN(age)) setBadge(d.mock ? 'MOCK (待機中)' : '待機中', '');
      else if (age > limit) setBadge('STALE (' + Math.round(age) + ' 秒更新なし)', 'stale');
      else setBadge(d.mock ? 'LIVE (MOCK)' : 'LIVE', 'live');
    }

    window.onload = initChart;
  </script>
</body>
</html>
